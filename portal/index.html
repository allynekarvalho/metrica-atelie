<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:#0A0A0A;color:#fff;min-height:100vh}

.body{padding:20px}

.secao-titulo{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#6B6B6B;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #2E2E2E}

.total-box .tv{font-size:16px;font-weight:700;color:#0A0A0A}

.saldo-val{font-size:13px;font-weight:600;color:#B8B8B8;margin-bottom:8px}
.pix-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}

body{padding-bottom:70px}

<script>

async function supa(path) {
  var res = await fetch(SUPA_URL + "/rest/v1/" + path, {
    headers: {
      "apikey": SUPA_KEY,
      "Authorization": "Bearer " + SUPA_KEY
    }
  });
  var text = await res.text();
  return text ? JSON.parse(text) : [];
}
async function supaPatch(path, body) {
  return fetch(SUPA_URL + "/rest/v1/" + path, {
    method: "PATCH",
    headers: {
      "apikey": SUPA_KEY,
      "Authorization": "Bearer " + SUPA_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify(body)
  });
}
function fmtBR(n){ return Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function alocarItens(pecas, saldoAnt, totPg, desconto){
  saldoAnt = saldoAnt||0; desconto = desconto||0; totPg = totPg||0;
  var ord = pecas.filter(function(p){ return (p.valor||0) > 0; }).slice().sort(function(a,b){ return (String(a.data_entrada||"")+String(a.criado_em||"")).localeCompare(String(b.data_entrada||"")+String(b.criado_em||"")); });
  var credito = totPg + desconto - ord.filter(function(p){ return p.pago_em; }).reduce(function(s,p){ return s+(p.valor||0); },0); if(credito<0) credito=0;
  var antPago = Math.min(saldoAnt, credito); credito -= antPago;
  var itens = ord.map(function(p){ var v=p.valor||0; if(p.pago_em) return {p:p, v:v, pago:v, falta:0, direto:true}; var pg=Math.min(v, credito); credito -= pg; return {p:p, v:v, pago:pg, falta:+(v-pg).toFixed(2)}; });
  return {ord:ord, itens:itens, antPago:antPago};
}
function extratoHTML(pecas, saldoAnt, totPg, desconto, nota){
  saldoAnt = saldoAnt||0; desconto = desconto||0; totPg = totPg||0;
  var AL = alocarItens(pecas, saldoAnt, totPg, desconto), ord = AL.ord, itens = AL.itens, antPago = AL.antPago;
  var totServ = saldoAnt + ord.reduce(function(s,p){ return s+(p.valor||0); },0);
  var falta = +(totServ - totPg - desconto).toFixed(2);
  var aPagar = itens.filter(function(i){ return i.falta > 0.009; }).reverse();
  var pagas = itens.filter(function(i){ return i.falta <= 0.009; }).reverse();
  function dBR(d){ return d ? d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(2,4) : "sem data"; }
  function grupoHTML(lista, cor, mostraFalta){
    var g={}, ordem=[];
    lista.forEach(function(i){ var d=i.p.data_entrada||""; if(!g[d]){ g[d]=[]; ordem.push(d); } g[d].push(i); });
    ordem.sort(function(a,b){ return b.localeCompare(a); });
    return ordem.map(function(d){
      var its=g[d], tot=its.reduce(function(s,i){ return s+(mostraFalta?i.falta:i.v); },0);
      return "<details style='border-bottom:1px solid #F2F2F2'><summary style='display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer;list-style:none'><span style='font-size:13px;color:#0A0A0A'>📅 <b>"+dBR(d)+"</b> · "+its.length+" peça"+(its.length!==1?"s":"")+"</span><span style='font-weight:700;color:"+cor+";white-space:nowrap'>"+fval(tot)+" ›</span></summary>"+
        its.map(function(i){ var acao = window.EXTRATO_ACOES ? (mostraFalta ? " <button class='bm vd' style='padding:2px 8px;font-size:11px' onclick=\"event.preventDefault();pagarPeca('"+i.p.id+"')\">✓ Pago</button>" : (i.direto ? " <button class='bm' style='padding:2px 6px;font-size:11px' title='Desfazer' onclick=\"event.preventDefault();desfazerPagPeca('"+i.p.id+"')\">↩</button>" : "")) : ""; return "<div style='display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0 4px 18px;font-size:12px;color:#444'><span style='text-transform:uppercase'>"+i.p.peca+(i.p.observacao?" <span style='text-transform:none;color:#4169E1'>· "+i.p.observacao+"</span>":"")+"</span><span style='white-space:nowrap'>"+(mostraFalta&&i.pago>0.009?"falta "+fval(i.falta):fval(i.v))+acao+"</span></div>"; }).join("")+"<div style='height:6px'></div></details>";
    }).join("");
  }
  var cardTop = falta > 0.009
    ? "<div style='background:#fff;border-radius:12px;padding:18px 16px;margin-bottom:12px;border-left:5px solid #8B0000'><div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#6B6B6B'>Falta pagar</div><div style='font-size:30px;font-weight:700;color:#8B0000;margin:2px 0 6px'>"+fval(falta)+"</div><div style='font-size:12px;color:#6B6B6B'>"+aPagar.length+" peça"+(aPagar.length!==1?"s":"")+(saldoAnt-antPago>0.009?" + saldo anterior":"")+" em aberto · já pago "+(fval(totPg)||"R$ 0,00")+(desconto>0?" · desconto "+fval(desconto):"")+"</div></div>"
    : "<div style='background:#fff;border-radius:12px;padding:18px 16px;margin-bottom:12px;border-left:5px solid #2E5E2E'><div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#6B6B6B'>Situação</div><div style='font-size:24px;font-weight:700;color:#2E5E2E;margin-top:2px'>Tudo pago ✓</div>"+(falta < -0.009?"<div style='font-size:12px;color:#2E5E2E;margin-top:4px'>Crédito de "+fval(-falta)+" para as próximas peças</div>":"")+"</div>";
  var blocoAPagar = (aPagar.length || saldoAnt-antPago>0.009)
    ? "<div style='background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:12px'><div style='font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#8B0000;margin-bottom:2px'>🧾 Em aberto</div>"+
      grupoHTML(aPagar,"#8B0000",true)+
      (saldoAnt-antPago>0.009?"<div style='display:flex;justify-content:space-between;padding:9px 0'><div style='font-size:13px;font-weight:600'>SALDO ANTERIOR</div><div style='font-weight:700;color:#8B0000'>"+fval(saldoAnt-antPago)+"</div></div>":"")+
      "</div>" : "";
  var blocoPagas = pagas.length
    ? "<details style='background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:12px'><summary style='font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#2E5E2E;cursor:pointer'>✅ Já pagas ("+pagas.length+") · "+fval(pagas.reduce(function(s,i){ return s+i.v; },0))+" <span style='font-weight:400;text-transform:none;color:#6B6B6B'>— toque para ver</span></summary>"+
      grupoHTML(pagas,"#2E5E2E",false)+"</details>" : "";
  return cardTop + (nota||"") + blocoAPagar + blocoPagas;
}
function fval(v) {
  if(!v) return "";
  return "R$ "+fmtBR(v);
}
function slbl(s) {
  return {
    urgente:"🔴 Urgente",
    aguardando:"⏳ Aguardando",
    "em-andamento":"🪡 Em andamento",
    pronto:"✅ Pronto para retirar",
    entregue:"🎁 Entregue"
  }[s] || s;
}
function fdata(d) {
  if(!d) return "";
  return new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function copiarPix() {
  navigator.clipboard.writeText(CHAVE_PIX_ATELIE).then(function(){
    var btn = document.querySelector(".btn-pix");
    if(btn){ var t = btn.textContent; btn.textContent = "Copiado!"; setTimeout(function(){ btn.textContent = t; },1500); }
  });
}
var ABA_ATUAL = null;
var TODAS_PECAS = [];
function mudarAba(nome) {
  ABA_ATUAL = nome;
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("active", t.dataset.tab===nome); });
  document.querySelectorAll(".painel").forEach(function(p){ p.classList.toggle("active", p.id==="painel-"+nome); });
}
function renderPeca(p, tipo) {
  var html = "<div class='pcard"+(tipo==="pecas"&&p.prioridade_cliente?" prioridade":"")+"'>";
html += "<label class='selw'><input type='checkbox' "+(SEL[p.id]?"checked ":"")+"onchange=\"selToggle('"+p.id+"',this.checked)\"><span></span></label>";
  if(p.foto_url) html += "<img src='"+p.foto_url+"' data-full='"+p.foto_url+"' class='pfoto' loading='lazy' decoding='async' onerror='fotoCarregaErro(this)'>";
  html += "<div class='pinfo'"+(p.foto_url?"":" style='padding-left:54px'")+"><div class='pnome'>"+p.peca+"</div>";
  if(CLI && CLI.loja && p.observacao) html += "<div class='pserv' style='color:#9DB4FF;font-style:italic'>Cliente: "+p.observacao+"</div>";
  if(p.servico) html += "<div class='pserv'>"+p.servico+"</div>";
  html += "<span class='badge "+p.status+"'>"+slbl(p.status)+"</span>";
  if(CLI && CLI.loja && !emRetrabalho(p) && p.valor) html += p.pago_em ? "<div style='display:inline-block;margin:8px 0 0 6px;padding:3px 10px;border-radius:12px;background:#E6F2E6;color:#2E5E2E;font-size:12px;font-weight:700'>✅ PAGA em "+fdata(p.pago_em).slice(0,5)+"</div>" : "<div style='display:inline-block;margin:8px 0 0 6px;padding:3px 10px;border-radius:12px;background:#FBEAEA;color:#8B0000;font-size:12px;font-weight:700'>⏳ AGUARDANDO PAGAMENTO</div>";
  if(emRetrabalho(p)) html += "<div style='margin-top:8px;font-size:13px;font-weight:600;color:#fff'>🔁 Retrabalho · sem custo</div>";
  else if(p.valor) html += "<div style='margin-top:8px;font-size:14px;font-weight:600;color:#fff'>"+fval(p.valor)+"</div>";
  if(tipo==="pecas") {
    html += "<button class='btn-toggle"+(p.prioridade_cliente?" ativo":"")+"' onclick=\"togglePeca('"+p.id+"','prioridade_cliente')\">"+(p.prioridade_cliente?"⭐ Prioridade":"☆ Marcar como prioridade")+"</button>";
  }
  if(tipo==="entregues") {
    if(p.confirmado_cliente_em) {
      html += "<div class='confirmado-txt'>✓ Recebimento confirmado em "+fdata(p.confirmado_cliente_em.split("T")[0])+"</div>";
    } else {
      html += "<button class='btn-toggle' onclick=\"togglePeca('"+p.id+"','confirmado_cliente_em')\">Confirmar recebimento</button>";
    }
  }
  html += "</div></div>";
  return html;
}
function renderLista(lista, vazioMsg, tipo) {
  if(!lista.length) return "<div class='empty'><span class='empty-ico'>🧵</span>"+vazioMsg+"</div>";
  var html = "";
  var porData = {};
  lista.forEach(function(p){
    var d = p.data_entrada || "—";
    if(!porData[d]) porData[d]=[];
    porData[d].push(p);
  });
  var datas = Object.keys(porData).sort(function(a,b){ return b.localeCompare(a); });
  datas.forEach(function(d){
    var totDia = porData[d].reduce(function(s,p){ return s+valCli(p); },0);
    html += "<div class='eg'><div class='ehdr'>📅 Entrada em "+fdata(d)+"</div>";
    porData[d].forEach(function(p){ html += renderPeca(p, tipo); });
    if(totDia>0) html += "<div style='display:flex;justify-content:space-between;padding:8px 2px 2px;font-size:12px;font-weight:600;color:#fff'><span>Total do dia</span><span>"+fval(totDia)+"</span></div>";
    html += "</div>";
  });
  return html;
}
function emRetrabalho(p){ return !!(p && p.status!=="entregue" && p.retrabalho_data && p.retrabalho_data===p.data_retorno); } function valCli(p){ return emRetrabalho(p)?0:(p.valor||0); }
var RELM = {pecas:[], pags:[], nome:"", tel:""};
function relmD(d){ return d ? new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"}) : ""; }
function relmMesAtual(){ var h=new Date(); return h.getFullYear()+"-"+String(h.getMonth()+1).padStart(2,"0"); }
function relmNomeMes(mes){ var p=mes.split("-"); var n=new Date(parseInt(p[0]),parseInt(p[1])-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); return n.charAt(0).toUpperCase()+n.slice(1); }
function relmDados(){
  var el=document.getElementById("relm-mes"); var mes=(el&&el.value)||relmMesAtual(); if(mes<"2026-09"){ mes="2026-09"; if(el) el.value=mes; } var pt=mes.split("-");
  var ini=mes+"-01", fim=mes+"-"+String(new Date(parseInt(pt[0]),parseInt(pt[1]),0).getDate()).padStart(2,"0");
  function dentro(d){ return d && d>=ini && d<=fim; }
  var pp=RELM.pecas.filter(function(p){ return dentro(p.data_entrada); }).sort(function(a,b){ return String(a.data_entrada).localeCompare(String(b.data_entrada)); });
  var pg=RELM.pags.filter(function(p){ return dentro(p.data); }).sort(function(a,b){ return String(a.data).localeCompare(String(b.data)); });
  var tot=pp.reduce(function(s,p){ return s+valCli(p); },0), totPg=pg.reduce(function(s,p){ return s+(p.valor||0); },0);
  return {mes:mes, ini:ini, fim:fim, pp:pp, pg:pg, tot:tot, totPg:totPg, falta:tot-totPg};
}
function relmValTxt(p){ return emRetrabalho(p) ? "retrabalho · sem custo" : fval(p.valor||0); }
function relmBoxHTML(){
  return "<div style='background:#fff;border:1px solid #E8E8E8;border-radius:10px;padding:16px;margin:14px 0 12px;color:#0A0A0A'>"+
    "<div style='display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px'><div style='font-size:14px;font-weight:700'>📅 Relatório do mês</div>"+

function fotoCarregaErro(img){ var full=img.getAttribute("data-full")||img.dataset.url; var n=parseInt(img.getAttribute("data-try")||"0"); if(full && img.src.indexOf("-mini.jpg")>-1 && n===0){ img.setAttribute("data-try","1"); img.src=full; return; } if(n<3){ img.setAttribute("data-try",String(n+1)); setTimeout(function(){ img.src=(full||img.src).split("?")[0]+"?r="+Date.now(); },1500*(n+1)); return; } fotoErro(img); }

function renderComTotal(lista, tituloTotal, vazioMsg, tipo) {

async function togglePeca(id, campo) {
  var p = TODAS_PECAS.find(function(x){ return String(x.id)===String(id); });
  if(!p) return;
  var body = {};
  if(campo==="prioridade_cliente") {
    p.prioridade_cliente = !p.prioridade_cliente;
    body.prioridade_cliente = p.prioridade_cliente;
  } else if(campo==="confirmado_cliente_em") {
    p.confirmado_cliente_em = p.confirmado_cliente_em ? null : new Date().toISOString();
    body.confirmado_cliente_em = p.confirmado_cliente_em;
  }
  renderTudo();
  try {
    var res = await supaPatch("pecas?id=eq."+id, body);
    if(!res.ok) throw new Error("patch falhou");
  } catch(e) {
    if(campo==="prioridade_cliente") p.prioridade_cliente = !p.prioridade_cliente;
    if(campo==="confirmado_cliente_em") p.confirmado_cliente_em = p.confirmado_cliente_em ? null : new Date().toISOString();
    renderTudo();
  }
}

var CLI = null;

  var prontos = pecas.filter(function(p){ return p.status === "pronto"; });

  var saldoAnt = CLI.saldo_anterior || 0;

    linhaP("Subtotal", fval(subtotalP)||"R$ 0,00", {lc:"#0A0A0A",lw:"600"})+
    linhaP("Total pago", "− "+(fval(totPg)||"R$ 0,00"), {vc:"#2E5E2E"})+
    (desconto>0?linhaP("Desconto", "− "+fval(desconto), {vc:"#2E5E2E"}):"")+
    "<div style='border-top:2px solid #0A0A0A;margin:10px 0'></div>"+
    "<div style='display:flex;justify-content:space-between;align-items:baseline'><div style='font-size:14px;font-weight:700;color:#0A0A0A;text-transform:uppercase;letter-spacing:.5px'>Total a pagar</div><div style='font-size:24px;font-weight:700;color:"+corP+"'>R$ "+fmtBR(saldo)+"</div></div>"+

RELM={pecas:TODAS_PECAS, pags:PAGAMENTOS, nome:CLI.nome, tel:""}; relmRender();

async function init() {
  var token = new URLSearchParams(window.location.search).get('token');
  if(!token) {
    document.getElementById("body").innerHTML = "<div class='erro'>Link inválido.</div>";
    return;
  }
  try {
    var clientes = await supa("clientes?token_portal=eq."+token);
    if(!clientes||!clientes.length) {
      document.getElementById("body").innerHTML = "<div class='erro'>Cliente não encontrado.</div>";
      return;
    }
    CLI = clientes[0];
    document.getElementById("cli-nome").textContent = CLI.nome;
    document.getElementById("cli-sub").textContent = "Acompanhamento das suas peças";
    TODAS_PECAS = await supa("pecas?cliente_id=eq."+CLI.id+"&order=data_entrada.desc,criado_em.desc");
    PAGAMENTOS = await supa("pagamentos?cliente_id=eq."+CLI.id);
    if(!TODAS_PECAS.length) {
      document.getElementById("body").innerHTML = "<div class='empty'><span class='empty-ico'>🧵</span>Nenhuma peça no momento.</div>";
      return;
    }
    renderTudo();
  } catch(e) {
    document.getElementById("body").innerHTML = "<div class='erro'>Erro ao carregar: "+e.message+"</div>";
  }
}
